{const lc=document.getElementById('leftCtl'),bL=lc.querySelector('[data-k=left]'),bR=lc.querySelector('[data-k=right]'),lp=new Map();

/* ---------------- physics ---------------- */
const solidC=c=>c==='B'||c==='C'||c==='#'||c==='='||c==='G'||c==='H'||c==='P'||c==='S'||c==='L'||c==='U'||c==='n'||c==='Y'||c==='T';
function tileAt(tx,ty){if(ty<0||ty>=ROWS)return ' ';if(tx<0||tx>=L.w)return '#';return L.g[ty][tx];}
function solidAt(tx,ty){if(ty<0||ty>=ROWS)return false;if(tx<0||tx>=L.w)return true;return solidC(L.g[ty][tx]);}
function moveX(o){o.hitW=false;o.x+=o.vx;const y1=Math.floor(o.y/T),y2=Math.floor((o.y+o.h-1)/T);
  if(o.vx>0){const tx=Math.floor((o.x+o.w-1)/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)){o.x=tx*T-o.w;o.vx=0;o.hitW=true;break;}}
  else if(o.vx<0){const tx=Math.floor(o.x/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)){o.x=(tx+1)*T;o.vx=0;o.hitW=true;break;}}}
function moveY(o){const pb=o.y+o.h;o.onG=false;o.bump=null;o.y+=o.vy;const x1=Math.floor(o.x/T),x2=Math.floor((o.x+o.w-1)/T);
  if(o.vy>0){const ty=Math.floor((o.y+o.h)/T);for(let tx=x1;tx<=x2;tx++){const c=tileAt(tx,ty);if(solidC(c)||(c==='-'&&pb<=ty*T+.5)){o.y=ty*T-o.h;o.vy=0;o.onG=true;break;}}}
  else if(o.vy<0){const ty=Math.floor(o.y/T);for(let tx=x1;tx<=x2;tx++)if(solidAt(tx,ty)){o.y=(ty+1)*T;o.vy=0;const cx=Math.floor((o.x+o.w/2)/T);o.bump=solidAt(cx,ty)?{tx:cx,ty}:{tx,ty};break;}}}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function placeCoins(){const st=L.items.filter(i=>i.t==='star');const got=(store.get('coins',{})[lvlIdx])||[0,0,0];L.coins=got.slice();if(!st.length)return;
  const mx=L.zones[0].x1,pick=[],hi=a=>a.filter(i=>!pick.includes(i)).sort((p,q)=>p.y-q.y||q.x-p.x)[0];

const ARENA_L=152*T,ARENA_R=181*T,GROUND_Y=14*T,OWL_PL=ARENA_L+70,OWL_PR=ARENA_R-330,OWL_PY=96;
function stepPlay(){
  if(P.warp){P.warp.t++;P.y+=1.4;if(P.warp.t>=30)finishWarp();updCam();return;}
  const goL=inp.left&&!inp.right,goR=inp.right&&!inp.left;
  if(pressed('right')){if(frame-lastR<18)startDash(1);lastR=frame;}
  if(pressed('left')){if(frame-lastL<18)startDash(-1);lastL=frame;}
  if(P.dash>0){P.dash--;if(!((P.dashDir>0&&goR)||(P.dashDir<0&&goL)))P.dash=0;}

  for(let i=0;i<70;i++){const x=(i*137)%W,y=(i*71)%300,a=.3+.7*Math.abs(Math.sin(frame*.03+i));circ(x,y,i%5?1.2:2,`rgba(255,255,255,${a})`);}
  const mx=W*.8;circ(mx,120,70,'rgba(230,230,255,.08)');circ(mx,120,48,'#e9e6ff');circ(mx+16,112,44,'#0e0f2a');
  ctx.fillStyle='#120e26';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,430);for(let x=0;x<=W;x+=40)ctx.lineTo(x,430-Math.sin(x*.006)*40-Math.sin(x*.017)*14);ctx.lineTo(W,H);ctx.fill();
  const fx=W*.6,fy=410-Math.sin(fx*.006)*40-Math.sin(fx*.017)*14,fl=Math.sin(frame*.06)*4;
  if(teaserCh===3){for(let i=0;i<7;i++){const px=(i*173+40)%W,py=430-Math.sin(px*.006)*40-Math.sin(px*.017)*14+4;ctx.strokeStyle='#0a0818';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(px,py);ctx.quadraticCurveTo(px+14,py-60,px+6,py-120);ctx.stroke();ctx.fillStyle='#0a0818';for(let k=0;k<5;k++){const a=-Math.PI*.95+k*.48;ctx.beginPath();ctx.ellipse(px+6+Math.cos(a)*26,py-122+Math.sin(a)*12,28,7,a,0,Math.PI*2);ctx.fill();}}drawSpaceRockEgg(fx,fy+6,t);}
  else if(teaserCh===2)drawHatFigure(fx,fy,fl);else{
  ctx.fillStyle='#030309';ctx.beginPath();ctx.moveTo(fx-38-fl,fy);ctx.quadraticCurveTo(fx-30,fy-70,fx-18,fy-108);ctx.quadraticCurveTo(fx,fy-140,fx+18,fy-108);ctx.quadraticCurveTo(fx+30,fy-70,fx+40+fl,fy);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#030309';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(fx+34,fy);ctx.lineTo(fx+50,fy-120);ctx.stroke();
  const pulse=.6+.4*Math.sin(frame*.08);circ(fx+51,fy-128,26*pulse+8,'rgba(170,90,255,.18)');circ(fx+51,fy-128,12,`rgba(190,120,255,${.6+.4*pulse})`);circ(fx+48,fy-131,4,'#fff');
  const blink=frame%180<6;if(!blink){circ(fx-6,fy-112,3.2,'#ffe04d');circ(fx+7,fy-112,3.2,'#ffe04d');circ(fx-6,fy-112,7,'rgba(255,224,77,.18)');circ(fx+7,fy-112,7,'rgba(255,224,77,.18)');}
  for(let k=0;k<8;k++){const a=frame*.02+k*.8,r=40+(k%3)*12;ctx.globalAlpha=.5+.5*Math.sin(frame*.05+k);drawStar(fx+51+Math.cos(a)*r,fy-128+Math.sin(a)*r*.6,2.5,frame*.05);}ctx.globalAlpha=1;
}
  if(t>20){ctx.globalAlpha=Math.max(0,Math.min(1,(t-20)/30,1-(t-240)/20));txt(teaserCh===3?'Meanwhile, deep in the jungle...':'Meanwhile, far, far away...',W/2,60,28,'#d9ccff','center',null);ctx.globalAlpha=1;}
  if(t>70){const TL=teaseLine(),n=Math.floor((t-70)*.6),line=TL.slice(0,n);ctx.font=`800 20px ${FONT}`;const w=ctx.measureText(TL).width+34,bx=Math.max(16,Math.min(W-w-16,fx-w/2-60)),by=fy-230;
    rr(bx,by,w,48,18);ctx.fillStyle='rgba(20,14,40,.92)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#a98bff';ctx.stroke();ctx.beginPath();ctx.moveTo(fx-30,by+48);ctx.lineTo(fx-14,by+68);ctx.lineTo(fx-6,by+48);ctx.closePath();ctx.fillStyle='rgba(20,14,40,.92)';ctx.fill();
    txt(line,bx+17,by+25,20,'#e8deff','left',null);}
  if(t>260){const a=Math.min(1,(t-260)/40);ctx.globalAlpha=a;bigText('TO BE CONTINUED...',W/2,66,50,['#f3e8ff','#c9a8ff','#8a5cff']);txt(teaserCh===3?'Chapter 4 is coming soon!':teaserCh===2?'Chapter 3 is unlocked! ★':'Chapter 2 is unlocked! ★',W/2,116,24,'#fff','center',OL,5);ctx.globalAlpha=1;}
  if(t>100)txt('tap to continue',W/2,H-20,15,'rgba(255,255,255,.55)','center',null);
  if(t<40){ctx.fillStyle=`rgba(0,0,0,${1-t/40})`;ctx.fillRect(0,0,W,H);}}
function render(){ctx.setTransform(RES,0,0,RES,0,0);
  switch(state){case 'title':drawTitle();break;case 'map':drawMap();break;case 'story':drawStory();break;case 'card':drawCard();break;
    case 'play':case 'clear':case 'oneMore':case 'note':drawWorld();break;case 'end':drawEnd();break;case 'teaser':drawTeaser();break;}
}

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;
let gamePaused=false;const PLAYISH=['play','clear','oneMore','note','card'];
function pauseGame(kind){if(gamePaused)return;gamePaused=true;const brk=kind==='break';document.getElementById('pmH').textContent=brk?'🧃 BREAK TIME!':'⏸ PAUSED';document.getElementById('pmGo').textContent=brk?"▶ I'M BACK!":'▶ KEEP PLAYING';document.getElementById('pmTip').textContent=brk?'Super heroes need rest too! Time to stretch, drink some water, and rest your eyes.':'Your progress is saved at your last checkpoint flag.';hush();if(actx&&actx.state==='running')actx.suspend();document.getElementById('pm').style.display='flex';}
function resumeGame(){gamePaused=false;document.getElementById('pm').style.display='none';for(const k in inp)inp[k]=false;tap=null;if(actx&&!muted)actx.resume();}
function goHome(){resumeGame();hush();story=null;document.getElementById('hof').style.display='none';if(L){L.call=null;}P.ride=0;P.star=0;setState('title');if(themeFail)startSong('title');else stopSong();}
let whoNext=null;const $w=id=>document.getElementById(id);const AVC=['#e53935','#ff3d9a','#1e88e5','#43a047','#8e24aa','#fb8c00','#00897b','#5d4037'];
function pStat(id){const g=k=>{try{return JSON.parse(localStorage.getItem(KP+'p'+id+'_'+k));}catch(e){return null;}};const w=g('world')||1,st=g('stars')||0;return `⭐ ${st}  ·  ${w>5?'Ch.2 W'+(w-5):'World '+w}`;}
function switchPlayer(id){CURP=id;raw.set('cur',id);PNAME=(PLAYERS.find(p=>p.id===id)||{}).name||'';savedWorld=store.get('world',1);maxWorld=Math.max(store.get('max',1),savedWorld);totalStars=store.get('stars',0);raw.set('rname',PNAME);HARD=!!store.get('hard',false);EASY=!!store.get('easy',false);HERO=store.get('hero','noah')==='jojo'?'jojo':'noah';updShellBtn();}
function renderWho(){const pl=$w('plist');pl.innerHTML='';PLAYERS.forEach((p,i)=>{const d=document.createElement('div');d.className='pl';
    d.innerHTML=`<button class="pb${p.id===CURP?' on':''}"><span class="av" style="background:${AVC[i%AVC.length]}">${p.name.charAt(0)}</span><span>${p.name}<small>${pStat(p.id)}</small></span></button><button class="pdel" aria-label="Remove">✕</button>`;
    d.querySelector('.pb').onclick=()=>pickPlayer(p.id);
    d.querySelector('.pdel').onclick=()=>{d.innerHTML=`<div class="ask">Remove ${p.name}? <button class="yes">Yes</button><button class="no">No</button></div>`;
      d.querySelector('.yes').onclick=()=>{PLAYERS=PLAYERS.filter(q=>q.id!==p.id);raw.set('players',PLAYERS);for(const k of PROG){try{localStorage.removeItem(KP+'p'+p.id+'_'+k);}catch(e){}}if(CURP===p.id){CURP=null;raw.set('cur',null);PNAME='';}renderWho();};
      d.querySelector('.no').onclick=()=>renderWho();};
    pl.appendChild(d);});
  const none=!PLAYERS.length;$w('whoNew').style.display=none?'flex':'none';$w('whoAdd').style.display=none||PLAYERS.length>=8?'none':'';}
function openWho(next){whoNext=next||null;$w('whoName').value='';$w('whoMsg').textContent='';renderWho();$w('who').style.display='flex';}
function pickPlayer(id){switchPlayer(id);$w('who').style.display='none';sfx('fanfare');const f=whoNext;whoNext=null;if(f){whoPass=true;f();}}
$w('whoAdd').onclick=()=>{$w('whoNew').style.display='flex';$w('whoAdd').style.display='none';$w('whoName').focus();};
$w('whoX').onclick=()=>{$w('who').style.display='none';whoNext=null;sfx('bump');};
$w('whoName').addEventListener('keydown',e=>{if(e.key==='Enter')$w('whoGo').click();});$w('whoGo').onclick=()=>{let nm=($w('whoName').value||'').replace(/[^A-Za-z ]/g,'').trim().slice(0,10);if(!nm){$w('whoMsg').textContent='Type your first name first!';return;}
  nm=nm.charAt(0).toUpperCase()+nm.slice(1);const ex=PLAYERS.find(p=>p.name.toLowerCase()===nm.toLowerCase());if(ex){pickPlayer(ex.id);return;}
  const id=Date.now()%1e9;if(!PLAYERS.length)copyLegacy(id);else raw.set('migrated',true);PLAYERS.push({id,name:nm});raw.set('players',PLAYERS);pickPlayer(id);};
document.getElementById('pauseB').onclick=e=>{e.stopPropagation();ensureAudio&&ensureAudio();pauseGame();};
document.getElementById('homeB').onclick=e=>{e.stopPropagation();if(PLAYISH.includes(state))pauseGame();else goHome();};
document.getElementById('pmGo').onclick=()=>resumeGame();document.getElementById('pmHome').onclick=()=>goHome();
addEventListener('keydown',e=>{if(typing(e))return;if(e.code==='Escape'||e.code==='KeyP'){if(gamePaused)resumeGame();else if(PLAYISH.includes(state))pauseGame();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&PLAYISH.includes(state))pauseGame();});
let topShown='';function updTop(){const k=(PLAYISH.includes(state)?'p':'')+(state!=='title'&&state!=='map'?'h':'');if(k===topShown)return;topShown=k;document.getElementById('pauseB').style.display=k.includes('p')?'':'none';document.getElementById('homeB').style.display=k.includes('h')?'':'none';}
// ===== Bonus games open on top of Super Noah, so the theme song can keep playing =====
let bonusEl=null,bonusSt='menu',bonusMuted=false;
function openBonus(url){if(bonusEl)return;hush();bonusSt='menu';bonusMuted=false;bonusEl=document.createElement('iframe');
  bonusEl.src=url+'?embed=1&v='+VERSION+(SHARE?'&share=1':'');bonusEl.setAttribute('allow','autoplay; clipboard-write');bonusEl.title='Bonus game';
  bonusEl.style.cssText='position:fixed;inset:0;width:100%;height:100%;border:0;z-index:99999;background:#1a1b3a;';document.body.appendChild(bonusEl);
  setTimeout(()=>{try{bonusEl&&bonusEl.focus();}catch(e){}},300);}
function closeBonus(){if(!bonusEl)return;try{bonusEl.remove();}catch(e){}bonusEl=null;bonusMuted=false;tap=null;setState('title');}
addEventListener('message',e=>{const d=e.data;if(!d||!bonusEl||e.source!==bonusEl.contentWindow)return;
  if(d.sn==='rally'){bonusSt=d.s;bonusMuted=!!d.m;}else if(d.sn==='close')closeBonus();});
function loop(t){acc+=Math.min(100,t-last);last=t;
  if(bonusEl){acc=0;themeTick(bonusSt==='menu'||bonusSt==='lobby');if(themeEl&&bonusMuted)themeEl.muted=true;requestAnimationFrame(loop);return;}
  while(acc>=1000/60){if(!gamePaused)step();acc-=1000/60;}render();updTop();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
