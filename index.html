function popText(t,x,y,c){parts.push({kind:'text',text:t,x,y,vx:0,vy:-.9,life:55,c:c||'#ffd23f'});}
function setBig(v){const oh=P.h;P.big=v;P.h=v?50:34;P.w=v?24:22;P.y+=oh-P.h;P.growT=36;}

function E(t,x,y,w,h,o){return Object.assign({t,x,y,w,h,vx:0,vy:0,alive:true,dead:0,t0:0,bx:x,by:y,rot:0},o||{});}
function loadLevel(i){lvlIdx=i;const def=LEVELS[i];const b=def.build();
  L={def,w:b.w,g:b.g,tubes:b.tubes,zones:b.zones,tubeHint:false,hinted:{},lasers:[],ents:[],items:[],shooters:[],spawners:[],checks:[],end:null,boss:null,bumpA:null,nutWarned:false};
  for(const e of b.e){const px=e.x*T,py=e.y*T;
    switch(e.t){
      case 'star':L.items.push({t:'star',x:px+6,y:py+6,w:20,h:20,ph:Math.random()*6});break;
      case 'goon':L.ents.push(E('goon',px+2,py+6,28,26,{vx:-.6}));break;
      case 'sprout':L.ents.push(E('sprout',px+3,py+4,26,28));break;
      case 'bug':L.ents.push(E('bug',px+3,py+6,26,20));break;
      case 'bat':L.ents.push(E('bat',px+2,py+6,28,20));break;
      case 'zap':L.ents.push(E('zap',px,py+4,34,26));break;
      case 'cannon':L.shooters.push({x:px,y:py,cd:60+Math.random()*60});break;
      case 'roller':L.spawners.push({x:px,y:py,cd:30});break;
      case 'check':L.checks.push({x:px,y:py,on:false});break;
      case 'end':L.end={x:px,y:py};break;
      case 'boss':L.boss={x:px,y:py,w:96,h:72,hp:3,st:'wait',t:0,dir:-1,inv:0,active:false,started:false,tx:0};break;}}
  P.h=P.big?50:34;P.w=P.big?24:22;
  Object.assign(P,{x:5*T+5,y:14*T-P.h,vx:0,vy:0,face:1,hearts:5,inv:0,jumping:false,buf:0,coy:0,dash:0,growT:0,zone:0,star:0,warp:null,onTube:null});
  P.safe={x:P.x,fy:14*T};L.check={x:P.x,fy:14*T};
  Object.assign(R,{x:P.x-34,y:14*T-30,vx:0,vy:0,mode:'walk',face:1});
  J.x=P.x-40;J.y=P.y-30;J.sayT=0;J.heartT=0;J.cheerT=0;J.hint=null;J.nextCheer=(Math.floor(totalStars/25)+1)*25;cam.x=0;parts=[];P.boost=0;P.gfy=14*T;}

/* ---------------- physics ---------------- */
const solidC=c=>c==='#'||c==='='||c==='G'||c==='H'||c==='P'||c==='S'||c==='L'||c==='U'||c==='n'||c==='Y'||c==='T';
function tileAt(tx,ty){if(ty<0||ty>=ROWS)return ' ';if(tx<0||tx>=L.w)return '#';return L.g[ty][tx];}
function solidAt(tx,ty){if(ty<0||ty>=ROWS)return false;if(tx<0||tx>=L.w)return true;return solidC(L.g[ty][tx]);}
function moveX(o){o.hitW=false;o.x+=o.vx;const y1=Math.floor(o.y/T),y2=Math.floor((o.y+o.h-1)/T);
  if(o.vx>0){const tx=Math.floor((o.x+o.w-1)/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)){o.x=tx*T-o.w;o.vx=0;o.hitW=true;break;}}
  else if(o.vx<0){const tx=Math.floor(o.x/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)){o.x=(tx+1)*T;o.vx=0;o.hitW=true;break;}}}
function moveY(o){const pb=o.y+o.h;o.onG=false;o.bump=null;o.y+=o.vy;const x1=Math.floor(o.x/T),x2=Math.floor((o.x+o.w-1)/T);
  if(o.vy>0){const ty=Math.floor((o.y+o.h)/T);for(let tx=x1;tx<=x2;tx++){const c=tileAt(tx,ty);if(solidC(c)||(c==='-'&&pb<=ty*T+.5)){o.y=ty*T-o.h;o.vy=0;o.onG=true;break;}}}
  else if(o.vy<0){const ty=Math.floor(o.y/T);for(let tx=x1;tx<=x2;tx++)if(solidAt(tx,ty)){o.y=(ty+1)*T;o.vy=0;const cx=Math.floor((o.x+o.w/2)/T);o.bump=solidAt(cx,ty)?{tx:cx,ty}:{tx,ty};break;}}}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------------- gameplay ---------------- */
function hurt(srcX,isNut){if(P.inv>0||P.star>0||state!=='play')return;
  P.vy=-6;P.jumping=false;P.vx=(P.x+P.w/2<srcX)?-4:4;shake=8;P.dash=0;
  if(P.laser){P.laser=false;P.inv=130;sfx('shrink');jojoSay('Oh no! Lasers gone!');return;}
  if(P.big){setBig(false);P.inv=130;sfx('shrink');jojoSay(isNut?'No nuts for Noah!':'Oh no! Find another power bolt!');return;}
  P.hearts--;P.inv=130;sfx('hurt');
  if(P.hearts<=0){oneMore();return;}jojoSay(isNut?'No nuts for Noah!':rand(OUCH));}
function oneMore(){P.hearts=0;setState('oneMore');sfx('bubble');}
function respawn(){if(P.big)setBig(false);P.laser=false;P.hearts=5;P.x=L.check.x;P.y=L.check.fy-P.h;P.vx=P.vy=0;P.inv=130;R.mode='walk';R.x=P.x-30;R.y=L.check.fy-R.h;
  if(L.boss&&L.boss.active){L.ents=L.ents.filter(e=>e.t!=='drop');if(L.boss.st==='swoop'||L.boss.st==='tired'){L.boss.st='rise';L.boss.t=0;}}
  J.x=P.x-40;J.y=P.y-30;jojoSay('One more try! You can do it!');setState('play');}
function fallPit(){sfx('bubble');P.x=P.safe.x;P.y=P.safe.fy-P.h;P.vx=P.vy=0;P.inv=100;bubbleFx=60;P.dash=0;jojoSay('I got you, Noah!');}
function killEnemy(e){e.alive=false;e.dead=0;burst(e.x+e.w/2,e.y+e.h/2,'#fff',8);}
function hitBoss(){const b=L.boss;if(b.inv>0||b.st==='beaten')return;b.hp--;b.inv=60;sfx('boss');shake=12;burst(b.x+48,b.y+30,'#ffe14d',20,'star');
  if(b.hp<=0){b.st='beaten';b.t=0;stopSong();sfx('fanfare');setTimeout(()=>startSong('victory'),1300);jojoSay('NOAH DID IT!!');L.ents.forEach(e=>{if(e.alive)killEnemy(e);});
    parts.push({kind:'comic',text:'TA-DA!',x:cam.x+W/2,y:150,vx:0,vy:0,life:120,big:true});}
  else{b.st='rise';b.t=0;jojoSay(b.hp===2?'Yay! Two more!':'Last one, Noah!!');}}
function levelClear(){setState('clear');stopSong();store.set('check',null);sfx('fanfare');savedWorld=Math.min(5,lvlIdx+2);store.set('world',savedWorld);store.set('stars',totalStars);P.vx=0;P.dash=0;}
function startWorld(i){loadLevel(i);setState('card');startSong(LEVELS[i].song);}
function resetNoah(){P.big=false;P.h=34;P.w=22;P.laser=false;}
function newGame(){totalStars=0;resetNoah();store.set('check',null);startSong('title');runStory(INTRO,()=>startWorld(0));}
function continueGame(){totalStars=store.get('stars',0);resetNoah();const wi=Math.max(0,Math.min(4,savedWorld-1));startWorld(wi);
  const ck=store.get('check',null);if(ck&&ck.w===wi){for(const c of L.checks)if(c.x<=ck.cx){c.on=true;c.rt=30;}L.check={x:ck.x,fy:ck.fy};P.x=ck.x;P.y=ck.fy-P.h;P.safe={x:P.x,fy:ck.fy};
    R.x=P.x-40;R.y=ck.fy-R.h;J.x=P.x-40;J.y=P.y-60;L.fromCheck=true;updCam(true);}}
function startEnding(){startSong('victory');runStory(ENDING,()=>{savedWorld=1;store.set('world',1);store.set('check',null);setState('end');startSong('victory');setTimeout(()=>openHof(totalStars),1800);});}
function startDash(d){P.dash=55;P.dashDir=d;P.face=d;sfx('dash');popText('ZOOM!',P.x+P.w/2,P.y-12,'#7fe3ff');if(Math.random()<.4)jojoSay('Zoom zoom!');}

const ARENA_L=152*T,ARENA_R=181*T,GROUND_Y=14*T;
function stepPlay(){
  if(P.warp){P.warp.t++;P.y+=1.4;if(P.warp.t>=30)finishWarp();updCam();return;}
  const goL=inp.left&&!inp.right,goR=inp.right&&!inp.left;
  if(pressed('right')){if(frame-lastR<18)startDash(1);lastR=frame;}
  if(pressed('left')){if(frame-lastL<18)startDash(-1);lastL=frame;}
  if(P.dash>0){P.dash--;if(!((P.dashDir>0&&goR)||(P.dashDir<0&&goL)))P.dash=0;}
  if(P.boost>0)P.boost--;const dashing=P.dash>0,acc=dashing?1.2:(P.onG?.7:.45),max=dashing?7.4:(P.boost>0?5.6:(L.def.fly?4.6:4));
  if(goL){P.face=-1;P.vx=P.vx<-max?Math.min(-max,P.vx*.93):Math.max(P.vx-acc,-max);}
  else if(goR){P.face=1;P.vx=P.vx>max?Math.max(max,P.vx*.93):Math.min(P.vx+acc,max);}
  else{P.vx*=P.onG?.7:.94;if(Math.abs(P.vx)<.08)P.vx=0;}
  if(dashing&&frame%3===0)parts.push({kind:'ghost',x:P.x+P.w/2,y:P.y+P.h,s:P.big?1.02:.76,face:P.face,walk:P.anim,air:!P.onG,life:14});
  if(pressed('jump'))P.buf=8;else if(P.buf>0)P.buf--;
  if(P.onG)P.coy=7;else if(P.coy>0)P.coy--;
  if(L.def.fly){const goUp=inp.jump||inp.up;if((P.buf>0||pressed('up'))&&P.onG){P.vy=-6;P.buf=0;sfx('jump');}if(goUp)P.vy=Math.max(P.vy-.75,-4.6);else if(inp.down)P.vy=Math.min(P.vy+.7,6);else P.vy=Math.min(P.vy+.3,4.2);P.jumping=false;}
  else{if(P.buf>0&&P.coy>0){P.vy=-12.5;P.buf=0;P.coy=0;P.jumping=true;sfx('jump');}
  if(P.jumping&&!inp.jump&&P.vy<-4)P.vy=-4;
  if(P.vy>=0)P.jumping=false;
  P.vy=Math.min(P.vy+.55,13);}
  moveX(P);moveY(P);
  if(L.def.fly&&P.y<40){P.y=40;if(P.vy<0)P.vy=0;}
  if(P.vy<0&&!P.bump){const ty=Math.floor(P.y/T);for(let tx=Math.floor(P.x/T);tx<=Math.floor((P.x+P.w-1)/T);tx++)if(tileAt(tx,ty)==='I'){L.g[ty][tx]='U';L.bumpA={tx,ty,t:8};P.y=(ty+1)*T;P.vy=0;
    L.items.push({t:'super',x:tx*T+4,y:ty*T,w:24,h:24,rise:28,vx:0,vy:0});sfx('sprout');popText('SECRET!',tx*T+16,ty*T-20,'#ff8fd8');jojoSay('A hidden crate!');break;}}
  if(P.bump){const {tx,ty}=P.bump;const c=L.g[ty][tx];
    if(c==='G'||c==='H'||c==='P'||c==='S'||c==='L'){L.g[ty][tx]='U';L.bumpA={tx,ty,t:8};
      if(c==='G'){totalStars++;sfx('star');parts.push({x:tx*T+16,y:ty*T-6,vx:0,vy:-3,life:30,c:'',kind:'star'});}
      else if(c==='H'){P.hearts=Math.min(5,P.hearts+1);sfx('heart');parts.push({x:tx*T+16,y:ty*T-6,vx:0,vy:-2.5,life:40,c:'',kind:'heart'});jojoSay('A heart! Yay!');}
      else{L.items.push({t:c==='S'?'super':c==='L'?'laser':'power',x:tx*T+4,y:ty*T,w:24,h:24,rise:28,vx:0,vy:0});sfx('sprout');}}
    else if(c==='='&&P.big){L.g[ty][tx]=' ';sfx('brk');shake=4;const bc=THEMES[L.def.theme].brick;
      for(let i=0;i<4;i++)parts.push({kind:'brick',x:tx*T+8+(i%2)*16,y:ty*T+8+(i>1?16:0),vx:(i%2?2.2:-2.2),vy:i>1?-4:-6.5,life:55,c:bc});
      for(const e of L.ents)if(e.alive&&e.x<tx*T+T&&e.x+e.w>tx*T&&Math.abs(e.y+e.h-ty*T)<6)killEnemy(e);}
    else sfx('bump');}
  if(L.bumpA&&--L.bumpA.t<=0)L.bumpA=null;
  if(P.growT>0)P.growT--;
  if(P.star>0){P.star--;if(frame%3===0)parts.push({kind:'dot',x:P.x+Math.random()*P.w,y:P.y+Math.random()*P.h,vx:(Math.random()-.5)*2,vy:-1.5,life:20,c:`hsl(${(frame*12)%360},100%,65%)`});}
  if(L.def.fly&&!P.onG&&P.y+P.h<12*T&&frame%15===0)P.safe={x:P.x,fy:P.y+P.h};
  if(P.onG){P.anim+=Math.abs(P.vx)*.18;const fx1=Math.floor((P.x+2)/T),fx2=Math.floor((P.x+P.w-2)/T),fy=Math.floor((P.y+P.h)/T);
    const ok=c=>solidC(c)||c==='-';
    if(L.boss&&L.boss.active){if(P.x>ARENA_L)P.safe={x:P.x,fy:P.y+P.h};}
    else if(ok(tileAt(fx1,fy))&&ok(tileAt(fx2,fy)))P.safe={x:P.x,fy:P.y+P.h};}
  if(P.inv>0)P.inv--;if(bubbleFx>0)bubbleFx--;
  {const x1=Math.floor(P.x/T),x2=Math.floor((P.x+P.w-1)/T),y1=Math.floor(P.y/T),y2=Math.floor((P.y+P.h-1)/T);
   for(let ty=y1;ty<=y2;ty++)for(let tx=x1;tx<=x2;tx++)if(tileAt(tx,ty)==='N'&&overlap(P,{x:tx*T+4,y:ty*T+16,w:24,h:16}))hurt(tx*T+16,true);}
  if(state!=='play')return;
  if(P.y>ROWS*T+20){fallPit();}
  P.onTube=null;if(P.onG){const fy=Math.floor((P.y+P.h+1)/T),cx=P.x+P.w/2;for(const tb of L.tubes)if((tb.room||tb.exit)&&fy===tb.top&&cx>tb.x*T+2&&cx<(tb.x+2)*T-2)P.onTube=tb;}
  if(P.onTube&&pressed('down')){startWarp(P.onTube);return;}
  if(!L.tubeHint&&!P.zone){for(const tb of L.tubes)if(tb.room&&Math.abs(P.x-tb.x*T)<170){L.tubeHint=true;jojoSay('A secret tube! Stand on it and press DOWN!');}}
  stepTruupa();
  if(P.lcd>0)P.lcd--;
  if(P.laser&&pressed('laser')&&!(P.lcd>0)){P.lcd=14;const sc=P.big?1.02:.76;L.lasers=L.lasers||[];L.lasers.push({x:P.x+P.w/2+P.face*10*sc,y:P.y+P.h-47*sc,vx:P.face*13,life:48});sfx('laser');}
  if(L.lasers){for(const z of L.lasers){z.x+=z.vx;z.life--;const tx=Math.floor(z.x/T);let ty=Math.floor(z.y/T),c=tileAt(tx,ty);
    for(let yy=Math.floor((z.y-6)/T);yy<=Math.floor((z.y+30)/T);yy++){const cc=tileAt(tx,yy);if(cc==='N'||cc==='n'){c=cc;ty=yy;}}
    if(c==='N'){L.g[ty][tx]=' ';boom(tx*T+16,ty*T+20,'ZAP!');z.life=0;continue;}
    if(c==='n'){L.g[ty][tx]=' ';L.shooters=L.shooters.filter(q=>Math.floor(q.x/T)!==tx);boom(tx*T+16,ty*T+16,'ZAP!');popText('CANNON BLASTED!',tx*T+16,ty*T-34,'#7fe3ff');z.life=0;continue;}
    if(solidC(c)){burst(z.x,z.y,'#ff5c8a',5);z.life=0;continue;}
    const zr={x:z.x-8,y:z.y-8,w:16,h:36};for(const e of L.ents)if(e.alive&&overlap(zr,e)){killEnemy(e);boom(e.x+e.w/2,e.y+e.h/2,'ZAP!');z.life=0;break;}
    const bb=L.boss;if(z.life>0&&bb&&bb.active&&bb.st==='tired'&&bb.inv===0&&overlap(zr,bb)){hitBoss();boom(z.x,z.y,'ZAP!');z.life=0;}}
    L.lasers=L.lasers.filter(z=>z.life>0);}
  for(const c of L.shooters){const dx=(P.x+P.w/2)-(c.x+16);if(c.flash>0)c.flash--;
    if(Math.abs(dx)<480&&Math.abs(dx)>40&&--c.cd<=0){c.cd=230;const dir=Math.sign(dx);
      L.ents.push(E('peanut',c.x+16+dir*18-9,c.y+8,18,12,{vx:dir*1.7}));sfx('cannon');c.flash=10;
      if(!L.nutWarned){L.nutWarned=true;jojoSay('Nuts! Jump or use Truupa Spin!');}}}
  for(const s of L.spawners){const dx=s.x-P.x;if(dx>60&&dx<720&&--s.cd<=0){s.cd=230;L.ents.push(E('boulder',s.x+2,s.y+4,28,28,{vx:-1.6}));}}
  for(const e of L.ents){if(!e.alive){e.dead++;continue;}
    const proj=e.t==='peanut'||e.t==='boulder'||e.t==='drop';
    if(!proj&&(e.x<cam.x-300||e.x>cam.x+W+300))continue;
    e.t0++;
    switch(e.t){
      case 'goon':{e.vy=Math.min(e.vy+.5,10);const v=e.vx;moveX(e);if(e.hitW)e.vx=-v;moveY(e);
        if(e.onG){const ax=e.vx>0?e.x+e.w+2:e.x-2;const tx=Math.floor(ax/T),ty=Math.floor((e.y+e.h+4)/T);const c=tileAt(tx,ty);if(!solidC(c)&&c!=='-')e.vx=-e.vx;}
        if(e.y>ROWS*T+50)e.gone=true;break;}
      case 'bug':e.x=e.bx+Math.sin(e.t0*.02)*60;e.y=e.by+Math.sin(e.t0*.05)*20;break;
      case 'bat':e.x=e.bx+Math.sin(e.t0*.025)*90;e.y=e.by+Math.abs(Math.sin(e.t0*.035))*80;break;
      case 'zap':e.y=e.by+Math.sin(e.t0*.03)*50;break;
      case 'peanut':e.x+=e.vx;if(e.t0>600||solidAt(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h/2)/T))){e.gone=true;burst(e.x+9,e.y+6,'#d9a35f',5);}break;
      case 'boulder':{e.vy=Math.min(e.vy+.5,10);moveX(e);if(e.hitW){e.gone=true;burst(e.x+14,e.y+14,'#8a7f74',10);}moveY(e);e.rot+=e.vx/14;if(e.y>ROWS*T+50)e.gone=true;break;}
      case 'drop':e.y+=e.vy;e.vy=Math.min(e.vy+.12,6);if(solidAt(Math.floor((e.x+5)/T),Math.floor((e.y+e.h)/T))){e.gone=true;burst(e.x+5,e.y+12,'#7fd3ff',5);}break;}
    if(e.alive&&!e.gone&&overlap(P,e)){
      if(P.star>0){killEnemy(e);sfx('stomp');continue;}
      const stompable=e.t==='goon'||e.t==='bug'||e.t==='bat'||e.t==='peanut';
      if(P.vy>0&&P.y+P.h-P.vy<=e.y+10){
        if(stompable){killEnemy(e);P.vy=inp.jump?-11:-8;P.jumping=inp.jump;sfx('stomp');jojoSay(rand(CHEER),.5);continue;}
        if(e.t==='boulder'){P.vy=-9;sfx('bump');continue;}}
      hurt(e.x+e.w/2,e.t==='peanut');if(state!=='play')return;}}
  L.ents=L.ents.filter(e=>!e.gone&&!(!e.alive&&e.dead>25));
  for(const it of L.items){
    if(it.t==='heart'){it.vy=Math.min((it.vy||0)+.3,6);it.vx=0;moveX(it);moveY(it);}
    if(it.t==='power'||it.t==='super'||it.t==='laser'){if(it.rise>0){it.y-=1;if(--it.rise===0)it.vx=1.3;}else{it.vy=Math.min(it.vy+.4,8);const v=it.vx;moveX(it);if(it.hitW)it.vx=-v;moveY(it);if(it.t==='super'&&it.onG)it.vy=-7;}}
    if(overlap(P,it)&&!((it.t==='power'||it.t==='super'||it.t==='laser')&&it.rise>10)){it.got=true;
      if(it.t==='star'){totalStars++;sfx('star');burst(it.x+10,it.y+10,'#ffe14d',5);if(Math.random()<.12)jojoSay(rand(['Sparkly!','Ooh, pretty!','So many stars!']));}

function stepBoss(){const b=L.boss;b.t++;if(b.inv>0)b.inv--;
  switch(b.st){
    case 'float':b.y+=(110-b.y)*.05;b.x+=b.dir*2;if(b.x<ARENA_L+40)b.dir=1;if(b.x+b.w>ARENA_R-40)b.dir=-1;

        else if(L.ents.filter(e=>e.t==='goon'&&e.alive).length<3)L.ents.push(E('goon',b.x+b.w/2-14,b.y+b.h-20,28,26,{vx:P.x<b.x?-.6:.6}));}

    case 'tired':if(b.t>330){b.st='rise';b.t=0;}break;
    case 'rise':b.y-=3;if(b.y<=110){b.y=110;b.st='float';b.t=0;}break;
    case 'beaten':b.y=Math.min(b.y+1.5,GROUND_Y-b.h);if(b.t%2===0)for(let k=0;k<3;k++)parts.push({kind:'conf',x:cam.x+Math.random()*W,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*2,life:140,c:['#ff5c8a','#ffd23f','#4aa3ff','#7be38b','#c69bff'][k+(b.t%3)],rot:Math.random()*6});if(b.t>170){startEnding();}return;}

/* ---------------- story & notes ---------------- */
function sayLine(ln){speak(ln.text,ln.who);if(ln.who==='Captain Grumble'){sfx('thunder');}}
function runStory(lines,done){story={lines,i:0,ch:0,done};setState('story');sayLine(lines[0]);}
function advanceStory(){const ln=story.lines[story.i];
  if(story.ch<ln.text.length){story.ch=ln.text.length;return;}
  story.i++;story.ch=0;stateT=0;
  if(story.i>=story.lines.length){hush();const d=story.done;story=null;d();}else sayLine(story.lines[story.i]);}
function stepStory(){const ln=story.lines[story.i];
  if(story.ch<ln.text.length){const before=Math.floor(story.ch/3);story.ch+=1.3;if(!(voiceOn&&!muted)&&Math.floor(story.ch/3)!==before)sfx('talk');}}

const NEXT_R=()=>({x:W-236,y:408,w:196,h:62}),BACK_R=()=>({x:W-210,y:480,w:144,h:42}),NOTE_R=()=>({x:W-266,y:446,w:232,h:64});

function storyBack(){if(state!=='story'||!story||story.i===0)return;story.i--;story.ch=story.lines[story.i].text.length;stateT=0;sayLine(story.lines[story.i]);sfx('bump');}
function userGo(src){
  if(state==='story'&&story&&stateT>6){const ln=story.lines[story.i];
    if(src==='tap'&&tap&&inR(tap,BACK_R())){storyBack();return;}
    if(src==='tap'&&!(tap&&inR(tap,NEXT_R()))){if(story.ch<ln.text.length)story.ch=ln.text.length;return;}
    if(story.ch<ln.text.length){story.ch=ln.text.length;return;}
    if(stateT>=45)advanceStory();}
  else if(state==='note'){if(src==='tap'&&!(tap&&inR(tap,NOTE_R())))return;advanceNote();}}

function step(){frame++;stateT++;

    case 'note':if(noteOut>0&&++noteOut>22){noteOut=0;startWorld(lvlIdx+1);}break;
    case 'oneMore':if(stateT>45&&anyGo())respawn();break;

  syncCtl();syncDown();
  for(const k in inp)prevInp[k]=inp[k];tap=null;
  for(const p of parts){p.x+=p.vx||0;p.y+=p.vy||0;if(p.kind==='dot'||p.kind==='brick')p.vy+=.25;p.life--;}parts=parts.filter(p=>p.life>0);

  if(stateT>30)bigButton(topL?W-290:W/2-110,topL?380:300,topL?240:220,topL?66:60,first?'START ▶':"LET'S GO ▶");}
function drawTitle(){drawBG('meadow',frame*.6,frame);
  ctx.save();ctx.translate(W/2,300);ctx.rotate(frame*.003);ctx.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-70,-720);ctx.lineTo(70,-720);ctx.closePath();ctx.fill();}ctx.restore();

  ctx.save();ctx.translate(W/2,84);ctx.rotate(-.035);
  bigText('SUPER',0,-30+Math.sin(frame*.06)*2,50,['#ffffff','#bfe3ff','#5aa9ff']);
  bigText('NOAH',0,34+Math.sin(frame*.06+1)*2,106,['#fff6a8','#ffcf3a','#ff7a1a']);
  for(let i=0;i<4;i++){const a=frame*.05+i*1.7,sx=[-170,165,-120,190][i],sy=[-40,-20,60,55][i],r=4+3*Math.abs(Math.sin(a));
    ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(sx,sy-r*2);ctx.lineTo(sx+r*.5,sy-r*.5);ctx.lineTo(sx+r*2,sy);ctx.lineTo(sx+r*.5,sy+r*.5);ctx.lineTo(sx,sy+r*2);ctx.lineTo(sx-r*.5,sy+r*.5);ctx.lineTo(sx-r*2,sy);ctx.lineTo(sx-r*.5,sy-r*.5);ctx.closePath();ctx.fill();}
  ctx.restore();
  txt('Rescue Daddy!',W/2,176,28,'#fff');txt('with JoJo & Truupa',W/2,206,17,'#ffe0f0','center',OL,4);
  drawJoJo(W/2-140,345+Math.sin(frame*.07)*8,1.9,1,{bubble:true,cheer:true});
  drawTruupa(W/2+135,372,2.1,-1,{thumbs:true});
  drawNoah(W/2,372,2.25,1,{fist:true,wind:true});
  txt('Pick your cape color:',W/2,400,20,'#fff');
  for(let i=0;i<6;i++){const sel=i===capeIdx;ctx.beginPath();ctx.arc(swX(i),SW_Y,sel?23:18,0,Math.PI*2);fs('#fff',2.5);circ(swX(i),SW_Y,sel?18.5:14,CAPES[i]);if(sel){ctx.fillStyle='#fff';starPath(swX(i),SW_Y,7);ctx.fill();}}
  const bt=titleButtons();bigButton(bt.start.x,bt.start.y,bt.start.w,bt.start.h,'▶ NEW ADVENTURE','#ff8a65','#e0413a');
  drawRaceBadge();bigButton(HOF_R.x,HOF_R.y,HOF_R.w,HOF_R.h,'🏆 HEROES','#ffd65a','#ff9a1f');drawHofTicker();
  if(bt.cont)bigButton(bt.cont.x,bt.cont.y,bt.cont.w,bt.cont.h,'CONTINUE: W'+savedWorld,'#64b5f6','#1e63c7');}
function drawRaceBadge(){const r=RACE_R,p=1+Math.sin(frame*.1)*.035;ctx.save();ctx.translate(r.x+r.w/2,r.y+r.h/2);ctx.scale(p,p);ctx.translate(-r.w/2,-r.h/2);
  const g=ctx.createLinearGradient(0,0,r.w,0);['#ff5c8a','#ffb02e','#ffe066','#7be38b','#4aa3ff','#a98bff'].forEach((c,i)=>g.addColorStop(i/5,c));
  rr(-5,-5,r.w+10,r.h+10,22);ctx.fillStyle=g;ctx.fill();rr(0,0,r.w,r.h,18);fs('#1d2457',2);
  ctx.save();ctx.beginPath();rr(0,0,r.w,r.h,18);ctx.clip();ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=10;for(let i=-2;i<8;i++){const x=((i*44+frame*2)%(r.w+80))-40;ctx.beginPath();ctx.moveTo(x,r.h);ctx.lineTo(x+40,0);ctx.stroke();}ctx.restore();
  ctx.save();ctx.translate(52,r.h-16);const bob=Math.sin(frame*.3)*1.2;drawTruupa(0,-10+bob,1.05,1,{});
  rr(-28,-24+bob,56,18,8);fs('#22a38f',1.8);ctx.fillStyle='rgba(255,255,255,.35)';rr(-24,-22+bob,48,4,2);ctx.fill();
  for(const wx of [-20,20]){ctx.beginPath();ctx.arc(wx,-5,7,0,Math.PI*2);fs('#1d1d26',1.5);circ(wx,-5,2.5,'#8e93a8');}
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<3;i++){const y=-20+i*7;ctx.moveTo(-38-((frame+i*5)%10),y);ctx.lineTo(-48-((frame+i*5)%10),y);}ctx.stroke();ctx.restore();
  txt('TRUUPA',158,22,15,'#7fe3ff','center',OL,4,HEAVY);bigText('TURBO',158,46,25,['#fff6a8','#ffcf3a','#ff7a1a']);bigText('RALLY',158,72,25,['#fff6a8','#ffcf3a','#ff7a1a']);
  rr(r.w-74,r.h-21,64,17,8);fs('#2f9e4a',1.5);txt('RACE! ▶',r.w-42,r.h-12.5,11,'#fff','center',null,0,HEAVY);
  ctx.save();ctx.translate(r.w-6,6);ctx.rotate(.3);ctx.fillStyle='#e53935';starPath(0,0,20,0);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke();txt('NEW!',0,1,10,'#fff','center',null,0,HEAVY);ctx.restore();
  ctx.restore();}
function drawHofTicker(){if(!hofTop||!hofTop.length)return;const n=Math.min(3,hofTop.length),x=W-226,y=68,h=34+n*24;
  rr(x,y,212,h,14);ctx.fillStyle='rgba(15,18,48,.62)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#ffd23f';ctx.stroke();
  txt('🏆 TOP HEROES',x+106,y+16,14,'#ffd23f','center',null,0,HEAVY);
  for(let i=0;i<n;i++){const r=hofTop[i];txt(['🥇','🥈','🥉'][i]+' '+r.name,x+12,y+38+i*24,15,'#fff','left',null);txt('⭐'+r.score,x+200,y+38+i*24,15,'#fff','right',null);}}
function drawEnd(){drawScene('homeEnd','');rr(W/2-290,400,580,132,20);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#2b2d6e';ctx.stroke();
  bigText('THE END',W/2-120,434,36,['#fff6a8','#ffcf3a','#ff7a1a']);txt('Super Noah and JoJo saved the day!',W/2-120,470,19,'#22243f','center',null);
  txt('★ '+totalStars+' stars collected',W/2-120,502,17,'#555','center',null);
  if(stateT>60)bigButton(W/2+60,436,210,60,'PLAY AGAIN ▶');}
function render(){ctx.setTransform(RES,0,0,RES,0,0);
  switch(state){case 'title':drawTitle();break;case 'story':drawStory();break;case 'card':drawCard();break;
    case 'play':case 'clear':case 'oneMore':case 'note':drawWorld();break;case 'end':drawEnd();break;}}

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
