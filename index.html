<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Super Noah</title>
<style>
html,body{margin:0;height:100%;background:#14163a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#7ec8ff;touch-action:none}
.ctl{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));display:none;gap:16px;z-index:5}
.ctl.left{left:max(16px,env(safe-area-inset-left))}
.ctl.right{right:max(16px,env(safe-area-inset-right));align-items:flex-end}
.btn{width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.7);color:#fff;font:900 30px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 2px 3px #0008;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.25)}
.btn small{font-size:12px;letter-spacing:1px;margin-top:-2px}
.btn.big{width:98px;height:98px;background:rgba(255,200,60,.45)}
.btn.on{background:rgba(255,255,255,.6);transform:scale(.94)}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:6;display:flex;gap:8px}
#top button{background:rgba(10,12,40,.55);color:#fff;border:2px solid rgba(255,255,255,.55);border-radius:12px;font-size:20px;padding:5px 9px;min-width:46px}
#top button.off{opacity:.45}
#rotate{position:fixed;inset:0;background:#2b2d6e;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;font:bold 28px system-ui,sans-serif;z-index:10;padding:24px;line-height:1.4}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
@media (max-height:500px){
  .btn{width:52px;height:52px;font-size:19px;border-width:2px;background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.55);box-shadow:none}
  .btn.big{width:58px;height:58px;background:rgba(255,200,60,.28)}
  .btn[data-k=shell]{width:46px;height:46px;font-size:16px}
  .btn small{font-size:8px;letter-spacing:.5px}
  .btn.on{background:rgba(255,255,255,.5)}
  .ctl{gap:8px;bottom:max(5px,env(safe-area-inset-bottom))}
  .ctl.left{left:max(6px,env(safe-area-inset-left))}
  .ctl.right{right:max(6px,env(safe-area-inset-right))}
  #top button{font-size:15px;padding:2px 6px;min-width:34px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="ctl left"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div>
<div class="ctl right"><div class="btn" data-k="shell">🐢<small>SPIN</small></div><div class="btn big" data-k="jump">⬆</div></div>
<div id="top"><button id="voice" aria-label="Read story aloud">🗣️</button><button id="mute" aria-label="Sound on or off">🔊</button></div>
<div id="rotate">🔄<br>Turn your device sideways<br>to play Super Noah!</div>
<script>
'use strict';
/* =========================================================
   SUPER NOAH — Rescue Papa Mario!   (v2)
   An original platformer made with love for Noah & JoJo.
   ========================================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=960;const H=544,T=32,ROWS=17;
let RES=1;
function fit(){const vw=window.visualViewport?visualViewport.width:innerWidth,vh=window.visualViewport?visualViewport.height:innerHeight;
  W=Math.round(Math.min(1300,Math.max(960,H*vw/vh)));const s=Math.min(vw/W,vh/H);cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
  RES=Math.min(2.5,Math.max(1,s*(window.devicePixelRatio||1)));cv.width=Math.round(W*RES);cv.height=Math.round(H*RES);}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,250));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();

const store={get(k,d){try{const v=localStorage.getItem('superNoah_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},
             set(k,v){try{localStorage.setItem('superNoah_'+k,JSON.stringify(v));}catch(e){}}};

const CAPES=['#e53935','#1e88e5','#43a047','#8e24aa','#fb8c00','#ec407a'];
let capeIdx=store.get('cape',1);if(!(capeIdx>=0&&capeIdx<6))capeIdx=1;
const cape=()=>CAPES[capeIdx];
let savedWorld=store.get('world',1);
const SKIN='#e0a67c',HAIR='#3d2414',HAIR2='#5a3418',OL='#17142e',SUIT='#26346a',SUIT_D='#1a2348',SKINT='#5cbf8f';
const FONT='"Avenir Next","Nunito","Trebuchet MS",system-ui,sans-serif';
const HEAVY='"Arial Black","Avenir Next","Helvetica Neue",system-ui,sans-serif';
const HAND='"Chalkboard SE","Marker Felt","Comic Sans MS","Bradley Hand",cursive';

/* ---------------- input ---------------- */
const inp={left:false,right:false,jump:false,shell:false,ok:false};
const prevInp={};
const KEYS={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyX:'shell',KeyS:'shell',KeyJ:'shell',Enter:'ok'};
addEventListener('keydown',e=>{const k=KEYS[e.code];if(k){if(!inp[k]&&(k==='jump'||k==='ok'))userGo();inp[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{const k=KEYS[e.code];if(k){inp[k]=false;e.preventDefault();}});
function pressed(k){return inp[k]&&!prevInp[k];}
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const ctlEls=[...document.querySelectorAll('.ctl')];let ctlShown=false;
function syncCtl(){const show=isTouch&&state==='play';if(show!==ctlShown){ctlShown=show;ctlEls.forEach(el=>el.style.display=show?'flex':'none');
  if(!show){for(const k in inp)inp[k]=false;document.querySelectorAll('.btn').forEach(b=>b.classList.remove('on'));}}}
document.querySelectorAll('.btn').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();if(k==='jump')userGo();inp[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=e=>{e.preventDefault();inp[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());});
let tap=null;
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();tap={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};userGo();});
const anyGo=()=>pressed('jump')||pressed('ok')||!!tap;

/* ---------------- audio (with iPad/iPhone unlock) ---------------- */
let actx=null,master=null,musicBus=null,noiseBuf=null,muted=store.get('muted',false);
const muteBtn=document.getElementById('mute'),voiceBtn=document.getElementById('voice');
let voiceOn=store.get('voice',true);
function setMute(m){muted=m;store.set('muted',m);muteBtn.textContent=m?'🔇':'🔊';if(master)master.gain.value=m?0:0.55;if(m)hush();}
function setVoice(v){voiceOn=v;store.set('voice',v);voiceBtn.classList.toggle('off',!v);if(!v)hush();}
muteBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();setMute(!muted);});
voiceBtn.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();unlockAudio();setVoice(!voiceOn);});
let curSong=null,wantSong=null,slot=0,nextT=0;
function ensureAudio(){
  if(!actx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{actx=new AC();}catch(e){return;}
    master=actx.createGain();master.gain.value=muted?0:0.55;master.connect(actx.destination);
    musicBus=actx.createGain();musicBus.gain.value=0.5;musicBus.connect(master);
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    try{const b=actx.createBuffer(1,1,22050),s=actx.createBufferSource();s.buffer=b;s.connect(actx.destination);s.start(0);}catch(e){}
    if(wantSong){const w=wantSong;wantSong=null;startSong(w);}}
  if(actx.state!=='running'){try{actx.resume();}catch(e){}}
}
function silentWav(){const n=4000,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));}
let unlocked=false;
function unlockAudio(){ensureAudio();
  if(!unlocked){unlocked=true;
    // Lets sound play on iPad/iPhone even when the side "silent" switch is on
    try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
    try{const a=document.createElement('audio');a.src=silentWav();a.loop=true;a.setAttribute('playsinline','');a.play().catch(()=>{});}catch(e){}
    try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}}}
['touchstart','touchend','pointerdown','click','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{capture:true,passive:true}));

const NOTE={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function hz(n){const m=n.match(/^([A-G]#?)(\d)$/);const midi=NOTE[m[1]]+(+m[2]+1)*12;return 440*Math.pow(2,(midi-69)/12);}
function toneAt(f,at,dur,type,vol,slide,dest){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,at);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),at+dur);
  g.gain.setValueAtTime(vol||0.12,at);g.gain.exponentialRampToValueAtTime(0.001,at+dur);
  o.connect(g);g.connect(dest||master);o.start(at);o.stop(at+dur+0.03);}
function noise(at,dur,vol,freq,type,dest){if(!actx||!noiseBuf)return;const s=actx.createBufferSource();s.buffer=noiseBuf;const f=actx.createBiquadFilter();
  f.type=type||'lowpass';f.frequency.value=freq||1000;const g=actx.createGain();g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(0.001,at+dur);
  s.connect(f);f.connect(g);g.connect(dest||master);s.start(at);s.stop(at+dur+0.05);}
const now=()=>actx?actx.currentTime:0;
const SFX={
  jump(){toneAt(330,now(),.15,'square',.1,720);},
  stomp(){toneAt(520,now(),.13,'square',.13,110);noise(now(),.06,.15,2500);},
  star(){toneAt(1320,now(),.07,'square',.08);toneAt(1760,now()+.06,.12,'square',.08);},
  heart(){[660,880,1100].forEach((f,i)=>toneAt(f,now()+i*.07,.12,'triangle',.2));},
  power(){[392,523,659,784,1047,1319].forEach((f,i)=>toneAt(f,now()+i*.06,.13,'square',.1));},
  shrink(){[784,622,523,392,311].forEach((f,i)=>toneAt(f,now()+i*.06,.12,'square',.1));},
  sprout(){toneAt(260,now(),.35,'triangle',.18,900);},
  brk(){noise(now(),.22,.4,1600,'bandpass');toneAt(150,now(),.12,'square',.1,60);},
  hurt(){toneAt(420,now(),.35,'sawtooth',.1,90);},
  shell(){toneAt(760,now(),.25,'triangle',.22,260);noise(now(),.3,.12,3000,'bandpass');},
  dash(){noise(now(),.3,.25,1200,'bandpass');toneAt(220,now(),.25,'sawtooth',.05,880);},
  bump(){toneAt(170,now(),.09,'square',.12);},
  check(){[523,659,784,1047].forEach((f,i)=>toneAt(f,now()+i*.08,.13,'square',.1));},
  fanfare(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>toneAt(f,now()+i*.13,.2,'square',.11));},
  boss(){toneAt(240,now(),.45,'sawtooth',.14,60);noise(now(),.4,.3,600);},
  thunder(){noise(now(),1.5,.6,320);noise(now(),.25,.35,2000,'bandpass');},
  cannon(){toneAt(130,now(),.14,'square',.09,60);noise(now(),.1,.15,800);},
  bubble(){toneAt(380,now(),.3,'sine',.25,1300);},
  whoosh(){noise(now(),.3,.2,1800,'bandpass');},
  talk(){toneAt(560+Math.random()*260,now(),.035,'square',.035);}
};
function sfx(n){if(actx&&!muted)SFX[n]();}
function buildSong(mel,bass,step,wave){const ev={};let s=0;
  for(let i=0;i<mel.length;i+=2){const n=mel[i],l=mel[i+1];if(n!=='-')(ev[s]=ev[s]||[]).push([hz(n),l,'m']);s+=l;}
  bass.forEach((n,i)=>(ev[i*2]=ev[i*2]||[]).push([hz(n),2,'b']));return {ev,len:s,step,wave};}
const MAIN=['C5',1,'E5',1,'G5',1,'E5',1,'F5',1,'A5',1,'G5',2,'E5',1,'C5',1,'D5',1,'E5',1,'D5',2,'-',2,'C5',1,'E5',1,'G5',1,'C6',1,'B5',1,'G5',1,'A5',2,'F5',1,'D5',1,'E5',1,'D5',1,'C5',2,'-',2];
const MAINB=['C3','G3','C3','G3','G2','D3','G2','D3','F2','C3','F2','C3','G2','D3','C3','G2'];
const MINOR=['A4',1,'C5',1,'E5',1,'A5',1,'G5',1,'E5',1,'F5',2,'E5',1,'D5',1,'C5',1,'D5',1,'E5',2,'-',2,'A4',1,'C5',1,'E5',1,'G5',1,'F5',1,'D5',1,'E5',2,'D5',1,'C5',1,'B4',1,'G#4',1,'A4',2,'-',2];
const MINB=['A2','E3','A2','E3','F2','C3','F2','C3','D3','A3','D3','A3','E2','B2','E2','B2'];
const SONGS={title:buildSong(MAIN,MAINB,.19,'triangle'),meadow:buildSong(MAIN,MAINB,.15,'square'),cave:buildSong(MAIN,MAINB,.18,'triangle'),
  sky:buildSong(MAIN,MAINB,.14,'square'),castle:buildSong(MINOR,MINB,.17,'square'),boss:buildSong(MINOR,MINB,.12,'square')};
function startSong(name){if(!actx){wantSong=name;return;}const s=SONGS[name];if(curSong===s)return;curSong=s;slot=0;nextT=actx.currentTime+0.06;}
function stopSong(){curSong=null;wantSong=null;}
setInterval(()=>{if(!actx||!curSong||actx.state!=='running')return;if(nextT<actx.currentTime-0.3)nextT=actx.currentTime+0.02;
  while(nextT<actx.currentTime+0.25){const evs=curSong.ev[slot];
    if(evs)for(const [f,l,v] of evs){if(v==='m')toneAt(f,nextT,l*curSong.step*0.9,curSong.wave,0.055,0,musicBus);else toneAt(f,nextT,l*curSong.step*0.9,'triangle',0.17,0,musicBus);}
    if(slot%4===0)toneAt(150,nextT,.12,'sine',.3,45,musicBus);
    if(slot%4===2)noise(nextT,.05,.08,6500,'highpass',musicBus);
    if(slot%8===4)noise(nextT,.12,.1,1800,'bandpass',musicBus);
    nextT+=curSong.step;slot=(slot+1)%curSong.len;}},40);
document.addEventListener('visibilitychange',()=>{if(!actx)return;if(document.hidden){actx.suspend();hush();}else actx.resume();});

/* ---------------- read-aloud voices ---------------- */
let enVoice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();enVoice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Zira/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
const VOICE={Narrator:[1,.95],Noah:[1.3,1.05],JoJo:[1.9,1.05],Mama:[1.2,1],'Papa Mario':[.8,.95],Papa:[.8,.95],'Captain Grumble':[.4,.85],Truupa:[.65,1.1]};
function speak(text,who,queue){if(!voiceOn||muted||!('speechSynthesis' in window))return;
  try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.replace(/[^\w\s.,!?'’-]/g,' '));const v=VOICE[who]||[1,1];
    u.pitch=v[0];u.rate=v[1];u.lang='en-US';if(enVoice)u.voice=enVoice;speechSynthesis.speak(u);}catch(e){}}
function hush(){try{speechSynthesis.cancel();}catch(e){}}
setMute(muted);setVoice(voiceOn);

/* ---------------- drawing helpers ---------------- */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function ell(x,y,rx,ry,c,rot){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,Math.PI*2);ctx.fill();}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fs(fill,lw){ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=lw||1.4;ctx.strokeStyle=OL;ctx.lineJoin='round';ctx.stroke();}
function puffs(list,fill,lw){ctx.strokeStyle=OL;ctx.lineWidth=lw||2.6;for(const [a,b,r] of list){ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.stroke();}
  ctx.fillStyle=fill;for(const [a,b,r] of list){ctx.beginPath();ctx.arc(a,b,r,0,Math.PI*2);ctx.fill();}}
function limb(px,py,ang,len,wid,col,end,endLen,foot){ctx.save();ctx.translate(px,py);ctx.rotate(ang);
  rr(-wid/2,-wid/2,wid,len+wid/2,wid/2);fs(col,1.1);
  if(end){rr(-wid/2-.4,len-endLen,wid+.8,endLen+wid/2,wid/2);fs(end,1.1);}
  if(foot){ctx.beginPath();ctx.ellipse(wid*.35,len+wid*.3,wid*.85,wid*.5,0,0,Math.PI*2);fs(end||col,1.1);}
  ctx.restore();}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;const f=p<0?0:255,t=Math.abs(p);
  r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return `rgb(${r},${g},${b})`;}
function starPath(x,y,r,rot){rot=rot||0;ctx.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,d=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*d,y+Math.sin(a)*d);}ctx.closePath();}
function boltPath(x,y,s){const p=[[2,-7],[-3.5,1],[-.2,1],[-2,7],[3.8,-1.2],[.4,-1.2],[2.6,-7]];ctx.beginPath();p.forEach(([a,b],i)=>{const X=x+a*s,Y=y+b*s;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.closePath();}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.35);ctx.bezierCurveTo(x,y,x-s,y,x-s,y+s*.35);ctx.bezierCurveTo(x-s,y+s*.75,x,y+s,x,y+s*1.25);
  ctx.bezierCurveTo(x,y+s,x+s,y+s*.75,x+s,y+s*.35);ctx.bezierCurveTo(x+s,y,x,y,x,y+s*.35);ctx.closePath();}
function drawHeart(cx,cy,s,c){heartPath(cx,cy-s*.62,s);ctx.fillStyle=c;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OL;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(cx-s*.45,cy-s*.3,s*.22,s*.14,-.6,0,Math.PI*2);ctx.fill();}
function drawStar(cx,cy,r,rot){ctx.fillStyle='#ffd23f';starPath(cx,cy,r,rot);ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OL;ctx.stroke();circ(cx-r*.25,cy-r*.25,r*.18,'#fff7c2');}
function drawPower(x,y){const p=1+Math.sin(frame*.15)*.08;circ(x,y,15*p,'rgba(120,220,255,.3)');
  const g=ctx.createRadialGradient(x-3,y-4,2,x,y,11);g.addColorStop(0,'#d4f7ff');g.addColorStop(1,'#1e88e5');
  ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=OL;ctx.stroke();
  ctx.fillStyle='#ffd84a';boltPath(x,y,1.25);ctx.fill();ctx.lineWidth=1;ctx.stroke();}
function txt(s,x,y,size,fill,align,stroke,lw,font){ctx.font=`800 ${size}px ${font||FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke!==null){ctx.lineWidth=lw||Math.max(3,size/5);ctx.strokeStyle=stroke||OL;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=fill||'#fff';ctx.fillText(s,x,y);}

      case 'end':L.end={x:px,y:py};break;
      case 'boss':L.boss={x:px,y:py,w:96,h:72,hp:3,st:'wait',t:0,dir:-1,inv:0,active:false,started:false,tx:0};break;}}
  P.h=P.big?50:34;P.w=P.big?24:22;
  Object.assign(P,{x:5*T+5,y:14*T-P.h,vx:0,vy:0,face:1,hearts:5,inv:0,jumping:false,buf:0,coy:0,dash:0,growT:0});
  P.safe={x:P.x,fy:14*T};L.check={x:P.x,fy:14*T};
  Object.assign(R,{x:P.x-34,y:14*T-30,vx:0,vy:0,mode:'walk',face:1});
  J.x=P.x-40;J.y=P.y-30;J.sayT=0;J.heartT=0;cam.x=0;parts=[];}

/* ---------------- physics ---------------- */
const solidC=c=>c==='#'||c==='='||c==='G'||c==='H'||c==='P'||c==='U'||c==='n';
function tileAt(tx,ty){if(ty<0||ty>=ROWS)return ' ';if(tx<0||tx>=L.w)return '#';return L.g[ty][tx];}
function solidAt(tx,ty){if(ty<0||ty>=ROWS)return false;if(tx<0||tx>=L.w)return true;return solidC(L.g[ty][tx]);}
function moveX(o){o.hitW=false;o.x+=o.vx;const y1=Math.floor(o.y/T),y2=Math.floor((o.y+o.h-1)/T);
  if(o.vx>0){const tx=Math.floor((o.x+o.w-1)/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)){o.x=tx*T-o.w;o.vx=0;o.hitW=true;break;}}
  else if(o.vx<0){const tx=Math.floor(o.x/T);for(let ty=y1;ty<=y2;ty++)if(solidAt(tx,ty)){o.x=(tx+1)*T;o.vx=0;o.hitW=true;break;}}}
function moveY(o){const pb=o.y+o.h;o.onG=false;o.bump=null;o.y+=o.vy;const x1=Math.floor(o.x/T),x2=Math.floor((o.x+o.w-1)/T);
  if(o.vy>0){const ty=Math.floor((o.y+o.h)/T);for(let tx=x1;tx<=x2;tx++){const c=tileAt(tx,ty);if(solidC(c)||(c==='-'&&pb<=ty*T+.5)){o.y=ty*T-o.h;o.vy=0;o.onG=true;break;}}}
  else if(o.vy<0){const ty=Math.floor(o.y/T);for(let tx=x1;tx<=x2;tx++)if(solidAt(tx,ty)){o.y=(ty+1)*T;o.vy=0;const cx=Math.floor((o.x+o.w/2)/T);o.bump=solidAt(cx,ty)?{tx:cx,ty}:{tx,ty};break;}}}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

/* ---------------- gameplay ---------------- */
function hurt(srcX,isNut){if(P.inv>0||state!=='play')return;
  P.vy=-6;P.jumping=false;P.vx=(P.x+P.w/2<srcX)?-4:4;shake=8;P.dash=0;
  if(P.big){setBig(false);P.inv=130;sfx('shrink');jojoSay(isNut?'No nuts for Noah!':'Oh no! Find another power bolt!');return;}
  P.hearts--;P.inv=130;sfx('hurt');
  if(P.hearts<=0){oneMore();return;}jojoSay(isNut?'No nuts for Noah!':rand(OUCH));}
function oneMore(){P.hearts=0;setState('oneMore');sfx('bubble');}
function respawn(){if(P.big)setBig(false);P.hearts=5;P.x=L.check.x;P.y=L.check.fy-P.h;P.vx=P.vy=0;P.inv=130;R.mode='walk';R.x=P.x-30;R.y=L.check.fy-R.h;
  if(L.boss&&L.boss.active){L.ents=L.ents.filter(e=>e.t!=='drop');if(L.boss.st==='swoop'||L.boss.st==='tired'){L.boss.st='rise';L.boss.t=0;}}
  J.x=P.x-40;J.y=P.y-30;jojoSay('One more try! You can do it!');setState('play');}
function fallPit(){sfx('bubble');P.x=P.safe.x;P.y=P.safe.fy-P.h;P.vx=P.vy=0;P.inv=100;bubbleFx=60;P.dash=0;jojoSay('I got you, Noah!');}
function killEnemy(e){e.alive=false;e.dead=0;burst(e.x+e.w/2,e.y+e.h/2,'#fff',8);}
function hitBoss(){const b=L.boss;if(b.inv>0||b.st==='beaten')return;b.hp--;b.inv=60;sfx('boss');shake=12;burst(b.x+48,b.y+30,'#ffe14d',20,'star');
  if(b.hp<=0){b.st='beaten';b.t=0;stopSong();sfx('fanfare');jojoSay('NOAH DID IT!!');L.ents.forEach(e=>{if(e.alive)killEnemy(e);});}
  else{b.st='rise';b.t=0;jojoSay(b.hp===2?'Yay! Two more!':'Last one, Noah!!');}}
function levelClear(){setState('clear');stopSong();sfx('fanfare');savedWorld=Math.min(4,lvlIdx+2);store.set('world',savedWorld);store.set('stars',totalStars);P.vx=0;P.dash=0;}
function startWorld(i){loadLevel(i);setState('card');startSong(LEVELS[i].song);}
function resetNoah(){P.big=false;P.h=34;P.w=22;}
function newGame(){totalStars=0;resetNoah();startSong('title');runStory(INTRO,()=>startWorld(0));}
function continueGame(){totalStars=store.get('stars',0);resetNoah();startWorld(Math.max(0,Math.min(3,savedWorld-1)));}
function startEnding(){runStory(ENDING,()=>{savedWorld=1;store.set('world',1);setState('end');startSong('title');});}
function startDash(d){P.dash=55;P.dashDir=d;P.face=d;sfx('dash');popText('ZOOM!',P.x+P.w/2,P.y-12,'#7fe3ff');if(Math.random()<.4)jojoSay('Zoom zoom!');}

const ARENA_L=152*T,ARENA_R=181*T,GROUND_Y=14*T;
function stepPlay(){
  const goL=inp.left&&!inp.right,goR=inp.right&&!inp.left;
  if(pressed('right')){if(frame-lastR<18)startDash(1);lastR=frame;}
  if(pressed('left')){if(frame-lastL<18)startDash(-1);lastL=frame;}
  if(P.dash>0){P.dash--;if(!((P.dashDir>0&&goR)||(P.dashDir<0&&goL)))P.dash=0;}
  const dashing=P.dash>0,acc=dashing?1.2:(P.onG?.7:.45),max=dashing?7.4:4;
  if(goL){P.face=-1;P.vx=P.vx<-max?Math.min(-max,P.vx*.93):Math.max(P.vx-acc,-max);}
  else if(goR){P.face=1;P.vx=P.vx>max?Math.max(max,P.vx*.93):Math.min(P.vx+acc,max);}
  else{P.vx*=P.onG?.7:.94;if(Math.abs(P.vx)<.08)P.vx=0;}
  if(dashing&&frame%3===0)parts.push({kind:'ghost',x:P.x+P.w/2,y:P.y+P.h,s:P.big?1.02:.76,face:P.face,walk:P.anim,air:!P.onG,life:14});
  if(pressed('jump'))P.buf=8;else if(P.buf>0)P.buf--;
  if(P.onG)P.coy=7;else if(P.coy>0)P.coy--;
  if(P.buf>0&&P.coy>0){P.vy=-12.5;P.buf=0;P.coy=0;P.jumping=true;sfx('jump');}
  if(P.jumping&&!inp.jump&&P.vy<-4)P.vy=-4;
  if(P.vy>=0)P.jumping=false;
  P.vy=Math.min(P.vy+.55,13);
  moveX(P);moveY(P);
  if(P.bump){const {tx,ty}=P.bump;const c=L.g[ty][tx];
    if(c==='G'||c==='H'||c==='P'){L.g[ty][tx]='U';L.bumpA={tx,ty,t:8};
      if(c==='G'){totalStars++;sfx('star');parts.push({x:tx*T+16,y:ty*T-6,vx:0,vy:-3,life:30,c:'',kind:'star'});}
      else if(c==='H'){P.hearts=Math.min(5,P.hearts+1);sfx('heart');parts.push({x:tx*T+16,y:ty*T-6,vx:0,vy:-2.5,life:40,c:'',kind:'heart'});jojoSay('A heart! Yay!');}
      else{L.items.push({t:'power',x:tx*T+4,y:ty*T,w:24,h:24,rise:28,vx:0,vy:0});sfx('sprout');}}
    else if(c==='='&&P.big){L.g[ty][tx]=' ';sfx('brk');shake=4;const bc=THEMES[L.def.theme].brick;
      for(let i=0;i<4;i++)parts.push({kind:'brick',x:tx*T+8+(i%2)*16,y:ty*T+8+(i>1?16:0),vx:(i%2?2.2:-2.2),vy:i>1?-4:-6.5,life:55,c:bc});
      for(const e of L.ents)if(e.alive&&e.x<tx*T+T&&e.x+e.w>tx*T&&Math.abs(e.y+e.h-ty*T)<6)killEnemy(e);}
    else sfx('bump');}
  if(L.bumpA&&--L.bumpA.t<=0)L.bumpA=null;
  if(P.growT>0)P.growT--;
  if(P.onG){P.anim+=Math.abs(P.vx)*.18;const fx1=Math.floor((P.x+2)/T),fx2=Math.floor((P.x+P.w-2)/T),fy=Math.floor((P.y+P.h)/T);
    const ok=c=>solidC(c)||c==='-';
    if(L.boss&&L.boss.active){if(P.x>ARENA_L)P.safe={x:P.x,fy:P.y+P.h};}
    else if(ok(tileAt(fx1,fy))&&ok(tileAt(fx2,fy)))P.safe={x:P.x,fy:P.y+P.h};}
  if(P.inv>0)P.inv--;if(bubbleFx>0)bubbleFx--;
  {const x1=Math.floor(P.x/T),x2=Math.floor((P.x+P.w-1)/T),y1=Math.floor(P.y/T),y2=Math.floor((P.y+P.h-1)/T);
   for(let ty=y1;ty<=y2;ty++)for(let tx=x1;tx<=x2;tx++)if(tileAt(tx,ty)==='N'&&overlap(P,{x:tx*T+4,y:ty*T+16,w:24,h:16}))hurt(tx*T+16,true);}
  if(state!=='play')return;
  if(P.y>ROWS*T+20){fallPit();}
  stepTruupa();
  for(const c of L.shooters){const dx=(P.x+P.w/2)-(c.x+16);if(c.flash>0)c.flash--;
    if(Math.abs(dx)<480&&Math.abs(dx)>40&&--c.cd<=0){c.cd=230;const dir=Math.sign(dx);
      L.ents.push(E('peanut',c.x+16+dir*18-9,c.y+8,18,12,{vx:dir*1.7}));sfx('cannon');c.flash=10;
      if(!L.nutWarned){L.nutWarned=true;jojoSay('Nuts! Jump or use Truupa Spin!');}}}
  for(const s of L.spawners){const dx=s.x-P.x;if(dx>60&&dx<720&&--s.cd<=0){s.cd=230;L.ents.push(E('boulder',s.x+2,s.y+4,28,28,{vx:-1.6}));}}
  for(const e of L.ents){if(!e.alive){e.dead++;continue;}
    const proj=e.t==='peanut'||e.t==='boulder'||e.t==='drop';
    if(!proj&&(e.x<cam.x-300||e.x>cam.x+W+300))continue;
    e.t0++;
    switch(e.t){
      case 'goon':{e.vy=Math.min(e.vy+.5,10);const v=e.vx;moveX(e);if(e.hitW)e.vx=-v;moveY(e);
        if(e.onG){const ax=e.vx>0?e.x+e.w+2:e.x-2;const tx=Math.floor(ax/T),ty=Math.floor((e.y+e.h+4)/T);const c=tileAt(tx,ty);if(!solidC(c)&&c!=='-')e.vx=-e.vx;}
        if(e.y>ROWS*T+50)e.gone=true;break;}
      case 'bug':e.x=e.bx+Math.sin(e.t0*.02)*60;e.y=e.by+Math.sin(e.t0*.05)*20;break;
      case 'bat':e.x=e.bx+Math.sin(e.t0*.025)*90;e.y=e.by+Math.abs(Math.sin(e.t0*.035))*80;break;
      case 'peanut':e.x+=e.vx;if(e.t0>600||solidAt(Math.floor((e.x+e.w/2)/T),Math.floor((e.y+e.h/2)/T))){e.gone=true;burst(e.x+9,e.y+6,'#d9a35f',5);}break;
      case 'boulder':{e.vy=Math.min(e.vy+.5,10);moveX(e);if(e.hitW){e.gone=true;burst(e.x+14,e.y+14,'#8a7f74',10);}moveY(e);e.rot+=e.vx/14;if(e.y>ROWS*T+50)e.gone=true;break;}
      case 'drop':e.y+=e.vy;e.vy=Math.min(e.vy+.12,6);if(solidAt(Math.floor((e.x+5)/T),Math.floor((e.y+e.h)/T))){e.gone=true;burst(e.x+5,e.y+12,'#7fd3ff',5);}break;}
    if(e.alive&&!e.gone&&overlap(P,e)){
      const stompable=e.t==='goon'||e.t==='bug'||e.t==='bat'||e.t==='peanut';
      if(P.vy>0&&P.y+P.h-P.vy<=e.y+10){
        if(stompable){killEnemy(e);P.vy=inp.jump?-11:-8;P.jumping=inp.jump;sfx('stomp');jojoSay(rand(CHEER),.5);continue;}
        if(e.t==='boulder'){P.vy=-9;sfx('bump');continue;}}
      hurt(e.x+e.w/2,e.t==='peanut');if(state!=='play')return;}}
  L.ents=L.ents.filter(e=>!e.gone&&!(!e.alive&&e.dead>25));
  for(const it of L.items){
    if(it.t==='heart'){it.vy=Math.min((it.vy||0)+.3,6);it.vx=0;moveX(it);moveY(it);}
    if(it.t==='power'){if(it.rise>0){it.y-=1;if(--it.rise===0)it.vx=1.3;}else{it.vy=Math.min(it.vy+.4,8);const v=it.vx;moveX(it);if(it.hitW)it.vx=-v;moveY(it);}}
    if(overlap(P,it)&&!(it.t==='power'&&it.rise>10)){it.got=true;
      if(it.t==='star'){totalStars++;sfx('star');burst(it.x+10,it.y+10,'#ffe14d',5);if(Math.random()<.12)jojoSay(rand(['Sparkly!','Ooh, pretty!','So many stars!']));}
      else if(it.t==='power'){burst(it.x+12,it.y+12,'#7fe3ff',14,'star');
        if(!P.big){setBig(true);sfx('power');popText('POWER UP!',P.x+P.w/2,P.y-14);jojoSay('Whoa! BIG Noah!');}
        else{P.hearts=Math.min(5,P.hearts+1);totalStars+=3;sfx('heart');popText('SUPER!',P.x+P.w/2,P.y-14);}}
      else{P.hearts=Math.min(5,P.hearts+1);sfx('heart');burst(it.x+10,it.y+10,'#ff5c8a',8);}}}
  L.items=L.items.filter(i=>!i.got&&i.y<ROWS*T+40);
  for(const c of L.checks)if(!c.on&&overlap(P,{x:c.x+6,y:c.y-40,w:20,h:72})){c.on=true;L.check={x:c.x+5,fy:c.y+T};sfx('check');jojoSay('Checkpoint! Yay!');burst(c.x+16,c.y-30,'#ffe14d',12,'star');}
  const tx=P.x+P.w/2-P.face*58,ty=P.y-62;J.x+=(tx-J.x)*.08;J.y+=(ty-J.y)*.08;
  if(J.sayT>0)J.sayT--;J.idle++;if(J.idle>1300){jojoSay(rand(IDLE));}
  J.heartT++;if(P.hearts<=3&&J.heartT>600){J.heartT=0;L.items.push({t:'heart',x:J.x-10,y:J.y-30,w:20,h:18,vx:0,vy:-3});jojoSay('Here, Noah! A heart for you!');}
  const b=L.boss;
  if(b&&!b.started&&P.x>156*T){b.started=true;P.vx=0;P.dash=0;runStory(BOSS_INTRO,()=>{b.active=true;b.st='float';b.t=0;
    for(let y=2;y<=13;y++)L.g[y][151]='#';L.check={x:154*T,fy:GROUND_Y};setState('play');startSong('boss');});return;}
  if(b&&b.active)stepBoss();
  if(state!=='play')return;
  if(L.end&&P.x+P.w/2>L.end.x+36){levelClear();return;}
  let ct=P.x+P.w/2-W*.4+(P.dash>0?P.face*90:0);if(b&&b.active)ct=ARENA_L;
  ct=Math.max(0,Math.min(L.w*T-W,ct));cam.x+=(ct-cam.x)*.15;}

function stepTruupa(){
  if(pressed('shell')&&R.mode==='walk'){R.mode='spin';R.sx=R.x+R.w/2;R.sy=R.y+R.h-13;R.svx=P.face*8.5;R.dist=0;R.back=false;sfx('shell');popText('TRUUPA SPIN!',R.sx,R.sy-30,'#ffd23f');}
  if(R.mode==='walk'){
    const tx=P.x+P.w/2-P.face*50-R.w/2,dx=tx-R.x,maxV=P.dash>0?7.6:4.6;
    if(Math.abs(dx)>8){R.vx+=Math.sign(dx)*.6;R.vx=Math.max(-maxV,Math.min(maxV,R.vx));R.face=Math.sign(dx);}else{R.vx*=.7;R.face=P.face;}
    R.vy=Math.min(R.vy+.55,13);const wasG=R.onG;
    moveX(R);if(R.hitW&&wasG)R.vy=-11;
    if(wasG&&R.vy>=0){const ax=R.face>0?R.x+R.w+6:R.x-6;const c=tileAt(Math.floor(ax/T),Math.floor((R.y+R.h+4)/T));
      if(!solidC(c)&&c!=='-'&&Math.abs(dx)>24)R.vy=-12;
      if(P.onG&&P.y+P.h<R.y+R.h-40&&Math.abs(dx)<160)R.vy=-12.5;}
    moveY(R);R.anim+=Math.abs(R.vx)*.2;
    if(R.y>ROWS*T+30||Math.hypot(P.x-R.x,P.y-R.y)>520||(L.boss&&L.boss.active&&R.x<ARENA_L)){R.x=P.x+P.w/2-P.face*30-R.w/2;R.y=P.y+P.h-R.h;R.vx=R.vy=0;burst(R.x+9,R.y+15,'#fff',10);}
  }else{
    R.rot+=.6*Math.sign(R.svx);if(frame%2===0)parts.push({kind:'spinghost',x:R.sx,y:R.sy,rot:R.rot,life:10});
    {const ntx=Math.floor(R.sx/T),nty=Math.floor(R.sy/T);if(tileAt(ntx,nty)==='N'){L.g[nty][ntx]=' ';sfx('brk');burst(ntx*T+16,nty*T+24,'#dba864',14);if(!parts.some(p=>p.text==='NUTS BLASTED!'))popText('NUTS BLASTED!',ntx*T+16,nty*T-10,'#7fe3ff');jojoSay('Bye bye, nuts!');}}
    if(!R.back){R.sx+=R.svx;R.dist+=Math.abs(R.svx);const hx=Math.floor((R.sx+Math.sign(R.svx)*12)/T),hy=Math.floor(R.sy/T);
      if(tileAt(hx,hy)==='n'){L.g[hy][hx]=' ';L.shooters=L.shooters.filter(c=>Math.floor(c.x/T)!==hx);sfx('brk');shake=6;burst(hx*T+16,hy*T+16,'#7a4a24',16);popText('CANNON BLASTED!',hx*T+16,hy*T-10,'#7fe3ff');jojoSay('Truupa did it!');R.back=true;}
      else if(solidAt(hx,hy)||R.dist>340)R.back=true;}
    else{const hx=P.x+P.w/2-P.face*30,hy=P.y+P.h-13,dx=hx-R.sx,dy=hy-R.sy,d=Math.hypot(dx,dy);
      if(d<14){R.mode='walk';R.x=R.sx-R.w/2;R.y=P.y+P.h-R.h;R.vx=0;R.vy=-4;R.face=P.face;}else{R.sx+=dx/d*10;R.sy+=dy/d*10;}}
    const sr={x:R.sx-13,y:R.sy-13,w:26,h:26};
    for(const e of L.ents)if(e.alive&&overlap(sr,e)){killEnemy(e);sfx('stomp');jojoSay('Go Truupa!',.5);R.back=true;}
    const b=L.boss;if(b&&b.active&&b.st==='tired'&&b.inv===0&&overlap(sr,b)){hitBoss();R.back=true;}}}

function stepBoss(){const b=L.boss;b.t++;if(b.inv>0)b.inv--;
  switch(b.st){
    case 'float':b.y+=(110-b.y)*.05;b.x+=b.dir*2;if(b.x<ARENA_L+40)b.dir=1;if(b.x+b.w>ARENA_R-40)b.dir=-1;
      if(b.t%110===0){if((b.t/110)%2===1){for(let i=-1;i<=1;i++)L.ents.push(E('drop',b.x+b.w/2+i*34-5,b.y+b.h-10,10,14,{vy:1.5}));}
        else if(L.ents.filter(e=>e.t==='goon'&&e.alive).length<3)L.ents.push(E('goon',b.x+b.w/2-14,b.y+b.h-20,28,26,{vx:P.x<b.x?-.6:.6}));}
      if(b.t>380){b.st='swoop';b.t=0;b.tx=Math.max(ARENA_L+40,Math.min(ARENA_R-40-b.w,P.x+P.w/2-b.w/2));}break;
    case 'swoop':b.x+=(b.tx-b.x)*.06;b.y+=3.5;if(b.y+b.h>=GROUND_Y){b.y=GROUND_Y-b.h;b.st='tired';b.t=0;shake=10;sfx('bump');jojoSay('He is sleepy! Jump on him!');}break;
    case 'tired':if(b.t>330){b.st='rise';b.t=0;}break;
    case 'rise':b.y-=3;if(b.y<=110){b.y=110;b.st='float';b.t=0;}break;
    case 'beaten':b.y=Math.min(b.y+1.5,GROUND_Y-b.h);if(b.t>130){startEnding();}return;}
  if(overlap(P,b)){
    if(b.st==='tired'){if(b.inv===0&&P.vy>0&&P.y+P.h-P.vy<=b.y+22){hitBoss();P.vy=-11;}
      else if(!(P.vy>0&&P.y+P.h-P.vy<=b.y+22))P.vx=(P.x+P.w/2<b.x+b.w/2)?-5:5;else P.vy=-8;}
    else if(b.st==='swoop')hurt(b.x+b.w/2);}}

/* ---------------- story & notes ---------------- */
function sayLine(ln){speak(ln.text,ln.who);if(ln.who==='Captain Grumble'){sfx('thunder');}}
function runStory(lines,done){story={lines,i:0,ch:0,done};setState('story');sayLine(lines[0]);}
function advanceStory(){const ln=story.lines[story.i];
  if(story.ch<ln.text.length){story.ch=ln.text.length;return;}
  story.i++;story.ch=0;stateT=0;
  if(story.i>=story.lines.length){hush();const d=story.done;story=null;d();}else sayLine(story.lines[story.i]);}
function stepStory(){const ln=story.lines[story.i];
  if(story.ch<ln.text.length){const before=Math.floor(story.ch/3);story.ch+=1.3;if(!(voiceOn&&!muted)&&Math.floor(story.ch/3)!==before)sfx('talk');}}
function advanceNote(){if(stateT>34&&noteOut===0){noteOut=1;hush();sfx('whoosh');}}
function userGo(){if(state==='story'&&story&&stateT>8)advanceStory();else if(state==='note')advanceNote();}

/* ---------------- step ---------------- */
function step(){frame++;stateT++;
  switch(state){
    case 'title':stepTitle();break;
    case 'story':stepStory();break;
    case 'card':if(stateT>30&&anyGo())setState('play');else if(lvlIdx>0&&stateT>240)setState('play');break;
    case 'play':stepPlay();break;
    case 'clear':if(stateT>130){setState('note');noteOut=0;const n=NOTES[lvlIdx];sfx('whoosh');speak(n.text,'Papa');speak(n.jojo,'JoJo',true);}break;
    case 'note':if(noteOut>0&&++noteOut>22){noteOut=0;startWorld(lvlIdx+1);}break;
    case 'oneMore':if(stateT>45&&anyGo())respawn();break;
    case 'end':if(stateT>60&&anyGo())setState('title');break;}
  syncCtl();
  for(const k in inp)prevInp[k]=inp[k];tap=null;
  for(const p of parts){p.x+=p.vx||0;p.y+=p.vy||0;if(p.kind==='dot'||p.kind==='brick')p.vy+=.25;p.life--;}parts=parts.filter(p=>p.life>0);
  if(shake>0)shake-=.5;}

const swX=i=>W/2+(i-2.5)*56,SW_Y=432;
function titleButtons(){const cont=savedWorld>1&&savedWorld<=4;
  return cont?{start:{x:W/2-250,y:470,w:235,h:58},cont:{x:W/2+15,y:470,w:235,h:58}}:{start:{x:W/2-145,y:470,w:290,h:58},cont:null};}
const inR=(p,r)=>r&&p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h;
function stepTitle(){startSong('title');
  if(pressed('left')){capeIdx=(capeIdx+5)%6;store.set('cape',capeIdx);sfx('bump');}
  if(pressed('right')){capeIdx=(capeIdx+1)%6;store.set('cape',capeIdx);sfx('bump');}
  const bt=titleButtons();
  if(tap){for(let i=0;i<6;i++)if(Math.hypot(tap.x-swX(i),tap.y-SW_Y)<26){capeIdx=i;store.set('cape',i);sfx('star');return;}
    if(inR(tap,bt.start)){newGame();return;}if(inR(tap,bt.cont)){continueGame();return;}}
  if(pressed('ok')){bt.cont?continueGame():newGame();return;}
  if(pressed('jump'))newGame();}

  for(const e of L.ents)drawEnemy(e);
  if(R.mode==='walk')drawTruupa(R.x+R.w/2,R.y+R.h,.74,R.face,{walk:R.anim,run:Math.abs(R.vx)>.5&&R.onG,cheer:state==='clear'});
  else drawTruupa(R.sx,R.sy,.95,1,{spin:true,rot:R.rot});
  if(P.dash>0){ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<4;i++){const ly=P.y+8+i*(P.h/4),lx=P.x+P.w/2-P.face*(22+((frame*7+i*13)%24));ctx.moveTo(lx,ly);ctx.lineTo(lx-P.face*22,ly);}ctx.stroke();}

  let sc=P.big?1.02:.76;if(P.growT>0&&Math.floor(P.growT/4)%2)sc=P.big?.76:1.02;
  if(!blink)drawNoah(P.x+P.w/2,P.y+P.h+hop,sc,P.face,{walk:P.anim,run:P.onG&&Math.abs(P.vx)>.5,air:!P.onG||hop<0,cheer:state==='clear'||state==='note'});
  if(bubbleFx>0){ctx.globalAlpha=bubbleFx/60;ctx.strokeStyle='#bfe6ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(P.x+P.w/2,P.y+P.h/2-2,P.h*.8,0,Math.PI*2);ctx.stroke();circ(P.x+P.w/2,P.y+P.h/2-2,P.h*.8,'rgba(160,215,255,.25)');ctx.globalAlpha=1;}
  drawJoJo(J.x,J.y+Math.sin(frame*.07)*3,1.1,P.face,{bubble:true,cheer:J.sayT>0||state==='clear'});

function drawHouse(x,gy){rr(x,gy-150,210,150,2);fs('#ffe3b3',2.5);ctx.beginPath();ctx.moveTo(x-20,gy-148);ctx.lineTo(x+105,gy-235);ctx.lineTo(x+230,gy-148);ctx.closePath();fs('#e0614f',2.5);

function confetti(){const cols=['#ff5c8a','#ffd23f','#4aa3ff','#43a047','#8e24aa','#fb8c00'];for(let i=0;i<60;i++){const x=wrap(i*97+frame*(.5+i%3*.4),W),y=wrap(i*53+frame*(1.2+(i%4)*.4),H);

function sceneGround(c1,c2){rect(0,385,W,H-385,c1);rect(0,385,W,7,c2);rect(0,384,W,2,OL);}
function drawScene(n,who){const OX=(W-960)/2;ctx.save();drawSceneInner(n,who,OX);ctx.restore();if(n==='homeEnd')confetti();}
function drawSceneInner(n,who,OX){const tb=w=>who===w?-Math.abs(Math.sin(frame*.25))*6:0;const bob=Math.sin(frame*.06)*8,talk=w=>who===w;
  if(n.startsWith('home')||n==='grab'){drawBG('meadow',frame*.4,frame);sceneGround('#5ec95a','#8bee6f');
    if(n==='grab'){drawHouse(40+OX,385);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(20,18,60,.75)');g.addColorStop(1,'rgba(20,18,60,.35)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='rgba(190,210,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<60;i++){const x=wrap(i*97-frame*3,W+40)-20,y=wrap(i*53+frame*10,H);ctx.moveTo(x,y);ctx.lineTo(x-5,y+16);}ctx.stroke();
      if(frame%150<5){ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(0,0,W,H);}
      ctx.translate(OX,0);
      drawMama(380,385+tb('Mama'),2,1,{cheer:true});drawNoah(490,385,2.2,1,{plain:true});drawJoJo(570,385,2.2,1,{});
      const gx=760+Math.sin(frame*.03)*30,gy=150+bob+tb('Captain Grumble');
      ctx.strokeStyle='#ffe14d';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(gx,gy+50);ctx.lineTo(gx-6,gy+62);ctx.lineTo(gx+4,gy+66);ctx.lineTo(gx,gy+80);ctx.stroke();
      drawCage(gx,gy+124+tb('Papa Mario')*.5,.9);drawGrumble(gx,gy,1.5,'angry');}

      const fc=['#ff5c8a','#ffd23f','#4aa3ff','#43a047'];for(let i=0;i<14;i++){const t=(i+.5)/14,x=40+(W-80)*t,y=50+(1-Math.pow(2*t-1,2))*30;ctx.beginPath();ctx.moveTo(x-10,y);ctx.lineTo(x+10,y);ctx.lineTo(x,y+20);ctx.closePath();fs(fc[i%4],1.2);}

    if(n==='homeEnd'){
      drawPapa(300,385+tb('Papa Mario'),2,1,{cheer:true});drawMama(385,385+tb('Mama'),2,1,{cheer:true});drawNoah(480,385+tb('Noah'),2.2,1,{cheer:true});
      drawJoJo(560,385+tb('JoJo'),2.2,1,{cheer:true});drawTruupa(640,385+tb('Truupa'),2.2,1,{cheer:true});drawGrumble(810,230+bob,1.3,'happy');}}

      drawGrumble(610,200+bob+tb('Captain Grumble'),1.7,'angry');drawCage(855,190+tb('Papa Mario')*.5,1.5);}
    if(n==='castleSad'){drawTruupa(170,385,2.2,1,{});drawNoah(270,385+tb('Noah'),2.2,1,{});drawJoJo(90,320+bob+tb('JoJo'),2.1,1,{bubble:true,cheer:talk('JoJo')});
      drawGrumble(610,385-34*1.6+tb('Captain Grumble'),1.6,'sad');drawCage(855,190,1.5);}
    if(n==='castleHappy'){drawTruupa(150,385,2.2,1,{cheer:true});drawJoJo(230,385,2.2,1,{cheer:true});drawNoah(310,385,2.2,1,{cheer:true});

const WHO_C={'Narrator':'#6b6f80','Noah':null,'JoJo':'#ff4f9a','Mama':'#9b5de5','Papa Mario':'#2e8b57','Captain Grumble':'#3b4680','Truupa':'#3f5f9a'};
function drawStory(){const ln=story.lines[story.i];drawScene(ln.scene,ln.who);
  rr(20,392,W-40,140,20);ctx.fillStyle='rgba(255,255,255,.96)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#2b2d6e';ctx.stroke();

      :['← → walk   ·   SPACE jump   ·   X = Truupa Spin!','Double-tap → to ZOOM super fast!','Jump on the Grumble Goons to bop them','Hit the ⚡ crates for power bolts and grow BIG!','Jump over nuts or blast them with Truupa Spin!'];

function drawTitle(){drawBG('meadow',frame*.6,frame);
  ctx.save();ctx.translate(W/2,300);ctx.rotate(frame*.003);ctx.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-70,-720);ctx.lineTo(70,-720);ctx.closePath();ctx.fill();}ctx.restore();

function drawEnd(){drawScene('homeEnd','');rr(W/2-290,400,580,132,20);ctx.fillStyle='rgba(255,255,255,.95)';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#2b2d6e';ctx.stroke();
  bigText('THE END',W/2-120,434,36,['#fff6a8','#ffcf3a','#ff7a1a']);txt('Super Noah and JoJo saved the day!',W/2-120,470,19,'#22243f','center',null);
  txt('★ '+totalStars+' stars collected',W/2-120,502,17,'#555','center',null);
  if(stateT>60)bigButton(W/2+60,436,210,60,'PLAY AGAIN ▶');}
function render(){ctx.setTransform(RES,0,0,RES,0,0);
  switch(state){case 'title':drawTitle();break;case 'story':drawStory();break;case 'card':drawCard();break;
    case 'play':case 'clear':case 'oneMore':case 'note':drawWorld();break;case 'end':drawEnd();break;}}

/* ---------------- loop ---------------- */
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){step();acc-=1000/60;}render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
